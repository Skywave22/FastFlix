name: Android APK

on:
  push:
    # Run an artifact-only build on the active work branch; only tags publish.
    branches:
      - 'arena/f6eedbd9-fastflix'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to build and publish (leave blank for an artifact-only build)'
        required: false
        type: string

# The GitHub token is used to create/update the release; checkout only reads code.
permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.event_name == 'push' && github.ref_name || inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      mode: ${{ steps.build_mode.outputs.mode }}
    defaults:
      run:
        working-directory: FastFlix
    steps:
      - name: Check out the app
        uses: actions/checkout@v7
        with:
          path: FastFlix
          # A manual release must build the tag being published, not the branch
          # from which the workflow was dispatched.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false

      - name: Check out the pinned sibling player
        uses: actions/checkout@v7
        with:
          repository: BeamlakAschalew/flixquest-betterplayer
          ref: 9a4753b317c7153dbfc10738a6787fb3e5be8610
          path: flixquest-betterplayer
          persist-credentials: false

      - name: Test release configuration validation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Select release or preview mode
        id: build_mode
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          FLIXQUEST_ENV: ${{ secrets.FLIXQUEST_ENV }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FIREBASE_ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
        run: python3 .github/scripts/select_android_build.py

      - name: Prepare release configuration and signing
        if: ${{ steps.build_mode.outputs.mode == 'release' }}
        env:
          FLIXQUEST_ENV: ${{ secrets.FLIXQUEST_ENV }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 .github/scripts/prepare_android_release.py

      - name: Validate Firebase registration for the original package
        if: ${{ steps.build_mode.outputs.mode == 'release' }}
        env:
          FIREBASE_ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
        run: python3 .github/scripts/prepare_firebase_android.py release

      - name: Prepare preview configuration
        if: ${{ steps.build_mode.outputs.mode == 'preview' }}
        env:
          # These values are public-client configuration, not secrets from a
          # server: anyone with the APK can inspect them. A partial FLIXQUEST_ENV
          # still applies when signing/Firebase are unavailable.
          FLIXQUEST_ENV: ${{ secrets.FLIXQUEST_ENV }}
          PREVIEW_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || vars.TMDB_API_KEY }}
          PREVIEW_PROVIDER_URL: ${{ secrets.FLIXQUEST_API_URL || vars.FLIXQUEST_API_URL }}
          PREVIEW_BACKEND_URL: ${{ secrets.LARAVEL_API_URL || vars.LARAVEL_API_URL }}
        run: |
          python3 .github/scripts/prepare_android_preview.py
          python3 .github/scripts/prepare_firebase_android.py preview
          {
            echo '### Debug preview APK'
            echo 'This artifact uses public-client configuration and a preview-only debug signing key.'
            echo 'The debug key is cached on a best-effort basis; it may change if the cache expires.'
            echo 'Firebase options are deliberately invalid: Firebase services will not work.'
            echo 'Online features may not work. It cannot update a differently signed installation.'
            echo 'It is not suitable for a production release.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check example service reachability
        if: ${{ steps.build_mode.outputs.mode == 'preview' }}
        run: |
          # Diagnostics only: GitHub's network is not a user's device/network.
          # No credentials or configured secret URLs are sent or printed.
          for target in \
            'TMDB|https://api.themoviedb.org/3/configuration' \
            'Example provider API|https://scraper-1.flixquest.app/api/v2/providers'; do
            label="${target%%|*}"
            url="${target#*|}"
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 5 --max-time 10 "$url")" || status="unreachable"
            echo "::notice::$label reachability from CI: $status (no credentials sent)"
          done

      - name: Restore preview-only debug signing key
        if: ${{ steps.build_mode.outputs.mode == 'preview' }}
        id: preview_debug_signing
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.flixquest-preview/debug.keystore
          key: flixquest-preview-debug-signing-v1

      - name: Report preview signing continuity
        if: ${{ steps.build_mode.outputs.mode == 'preview' }}
        env:
          CACHE_HIT: ${{ steps.preview_debug_signing.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" == 'true' ]]; then
            echo '::notice::Restored the cached preview debug signing key.'
          else
            echo '::notice::No previous preview debug key was cached; this build creates one.'
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare preview-only signing key
        if: ${{ steps.build_mode.outputs.mode == 'preview' }}
        run: |
          key="$GITHUB_WORKSPACE/.flixquest-preview/debug.keystore"
          mkdir -p "$(dirname "$key")"
          if [[ ! -s "$key" ]]; then
            keytool -genkeypair -keystore "$key" -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname 'CN=Android Debug,O=Android,C=US' >/dev/null 2>&1
          fi
          keytool -list -keystore "$key" -storepass android -alias androiddebugkey >/dev/null
          echo "FLIXQUEST_PREVIEW_KEYSTORE=$key" >> "$GITHUB_ENV"

      - name: Cache preview-only signing key
        if: ${{ steps.build_mode.outputs.mode == 'preview' && steps.preview_debug_signing.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.flixquest-preview/debug.keystore
          key: flixquest-preview-debug-signing-v1

      - name: Verify signing keystore and alias
        if: ${{ steps.build_mode.outputs.mode == 'release' }}
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -keystore "$RUNNER_TEMP/flixquest-release-keystore.jks" \
            -storepass:env ANDROID_STORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > /dev/null

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: FastFlix/.fvmrc
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run branding and TV settings tests
        run: |
          set +e
          timeout 8m flutter test --no-pub --reporter expanded --concurrency 1 --timeout 60s --fail-fast \
            test/app_logo_test.dart test/tv_settings_screen_test.dart 2>&1 | tee "$RUNNER_TEMP/branding-test.log"
          test_status=${PIPESTATUS[0]}
          set -e
          if (( test_status != 0 )); then
            python3 .github/scripts/report_android_failure.py "$RUNNER_TEMP/branding-test.log"
            exit "$test_status"
          fi

      - name: Run feature tests
        run: |
          set +e
          timeout 12m flutter test --no-pub --reporter expanded --concurrency 1 --timeout 60s --fail-fast \
            test/anime_genre_test.dart \
            test/trending_anime_test.dart \
            test/home_feed_controller_test.dart \
            test/home_screen_test.dart \
            test/tv_home_controller_test.dart \
            test/connection_settings_test.dart \
            test/connection_diagnostics_test.dart \
            test/core/cache_behavior_test.dart \
            test/core/http_overrides_test.dart \
            test/provider_discovery_test.dart \
            test/provider_loader_test.dart \
            test/scraper_api_test.dart \
            test/data/scraper_cache_test.dart \
            test/tv_provider_order_dialog_test.dart \
            test/tmdb_connectivity_test.dart \
            test/tmdb_proxy_search_test.dart \
            test/fastflix_preferences_test.dart \
            test/hindi_source_priority_test.dart \
            test/manifest_size_estimator_test.dart \
            test/offline_download_test.dart \
            test/download_location_test.dart \
            test/download_settings_test.dart \
            test/player_audio_choices_test.dart \
            test/translation_catalog_test.dart \
            test/tv_remote_navigation_test.dart \
            test/tv_localization_test.dart \
            test/tv_back_dispatcher_test.dart \
            test/tv_update_test.dart \
            test/plus_screens_test.dart 2>&1 | tee "$RUNNER_TEMP/flutter-test.log"
          test_status=${PIPESTATUS[0]}
          set -e
          if (( test_status != 0 )); then
            python3 .github/scripts/report_android_failure.py "$RUNNER_TEMP/flutter-test.log"
            exit "$test_status"
          fi

      - name: Build universal APK
        if: ${{ steps.build_mode.outputs.mode == 'release' }}
        run: |
          flutter build apk --release --flavor prod --no-pub
          mkdir -p release-apks
          cp build/app/outputs/flutter-apk/app-prod-release.apk release-apks/FlixQuest-universal.apk

      - name: Build debug preview APK
        if: ${{ steps.build_mode.outputs.mode == 'preview' }}
        run: |
          set +e
          flutter build apk --debug --flavor prod --no-pub 2>&1 | tee "$RUNNER_TEMP/preview-build.log"
          build_status=${PIPESTATUS[0]}
          set -e
          if (( build_status != 0 )); then
            python3 .github/scripts/report_android_failure.py "$RUNNER_TEMP/preview-build.log"
            exit "$build_status"
          fi
          mkdir -p release-apks
          cp build/app/outputs/flutter-apk/app-prod-debug.apk release-apks/FlixQuest-preview-debug.apk
          cat > release-apks/README-preview.txt <<'EOF'
          This is a debug preview, not a production release.
          It uses example defaults unless public-client configuration is supplied at
          build time. Any supplied values are visible to anyone with the APK.
          Without a real TMDB key, provider API and reachable backend, online features
          may not work. On the device, Settings > Catalog & providers accepts a public
          TMDB v3 key and a compatible provider URL. That screen does not configure
          the Laravel backend. Values entered there are stored locally without
          encryption; never enter passwords, access tokens, or server/admin secrets.
          Its deliberately invalid Firebase options do not register the app; Firebase
          services cannot work without a real Firebase configuration for this package.
          Its preview-only debug signing key is cached on a best-effort basis and
          may change when the cache expires. It cannot update an installation signed
          by a different key. Do not distribute it as a production release.
          EOF

      - name: Run Android download unit tests
        env:
          BUILD_MODE: ${{ steps.build_mode.outputs.mode }}
        run: |
          set +e
          ./android/gradlew -p android :app:testProdDebugUnitTest \
            --tests 'dev.beamlak.flixquest_v2.downloads.DownloadSettingsTest' \
            --tests 'dev.beamlak.flixquest_v2.downloads.PublicDownloadDestinationTest' 2>&1 | tee "$RUNNER_TEMP/android-test.log"
          test_status=${PIPESTATUS[0]}
          set -e
          if (( test_status != 0 )); then
            if [[ "$BUILD_MODE" == 'preview' ]]; then
              python3 .github/scripts/report_android_failure.py "$RUNNER_TEMP/android-test.log"
            fi
            exit "$test_status"
          fi

      - name: Build per-ABI APKs
        if: ${{ steps.build_mode.outputs.mode == 'release' }}
        run: |
          flutter build apk --release --flavor prod --split-per-abi --no-pub
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-prod-release.apk" "release-apks/FlixQuest-${abi}.apk"
          done

      - name: Verify signatures and generate checksums
        run: |
          for apk in release-apks/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          done
          if [[ -n "${FLIXQUEST_PREVIEW_KEYSTORE:-}" ]]; then
            expected="$(keytool -exportcert -keystore "$FLIXQUEST_PREVIEW_KEYSTORE" \
              -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f1)"
            actual="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
              release-apks/FlixQuest-preview-debug.apk | \
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
            if [[ -z "$actual" || "${actual,,}" != "${expected,,}" ]]; then
              echo '::error::Preview APK was not signed by the prepared debug key.'
              exit 1
            fi
          fi
          (cd release-apks && sha256sum ./*.apk > SHA256SUMS.txt)

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build_mode.outputs.mode == 'release' && 'FlixQuest-android-apks' || 'FlixQuest-preview-debug-apk' }}
          path: FastFlix/release-apks/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Attach APKs to GitHub release
        if: ${{ steps.build_mode.outputs.mode == 'release' && ((github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # This also preserves the draft/prerelease state and existing notes.
            gh release upload "$RELEASE_TAG" release-apks/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            release_flags=(--verify-tag --generate-notes)
            # A semantic-version prerelease must not become the latest stable release.
            if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" release-apks/* --repo "$GITHUB_REPOSITORY" \
              "${release_flags[@]}"
          fi

      - name: Remove temporary configuration and signing material
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: rm -f FastFlix/.env FastFlix/android/key.properties "$RUNNER_TEMP/flixquest-release-keystore.jks" FastFlix/android/app/src/prod/debug/google-services.json FastFlix/android/app/src/prod/release/google-services.json

  upstream-public-client-diagnostic:
    name: Inspect upstream public client defaults
    runs-on: ubuntu-latest
    # A third-party download must not fail an otherwise valid build.
    continue-on-error: true
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download the public upstream release
        run: |
          curl -fsSL --connect-timeout 10 --max-time 180 \
            'https://github.com/flixquest/flixquest/releases/download/v4.3.0/app-arm64-v8a-prod-release.apk' \
            -o "$RUNNER_TEMP/upstream.apk"
      - name: Inspect public URL defaults without exposing client keys
        run: python3 .github/scripts/inspect_upstream_public_client.py "$RUNNER_TEMP/upstream.apk"
      - name: Remove the upstream release
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/upstream.apk"

  android-preview-smoke:
    name: Install preview on Android emulator
    needs: build
    if: ${{ needs.build.outputs.mode == 'preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: FlixQuest-preview-debug-apk
          path: preview
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch preview on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/android_preview_smoke.sh preview/FlixQuest-preview-debug.apk
      - name: Upload startup diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: FlixQuest-preview-startup-diagnostics
          path: ${{ runner.temp }}/flixquest-smoke/
          if-no-files-found: ignore
          retention-days: 7
