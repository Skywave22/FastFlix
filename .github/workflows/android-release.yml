name: Android APK

on:
  push:
    # Run an artifact-only build on the active work branch; only tags publish.
    branches:
      - 'arena/f6eedbd9-fastflix'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to build and publish (leave blank for an artifact-only build)'
        required: false
        type: string

# The GitHub token is used to create/update the release; checkout only reads code.
permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.event_name == 'push' && github.ref_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: FastFlix
    steps:
      - name: Check out the app
        uses: actions/checkout@v7
        with:
          path: FastFlix
          # A manual release must build the tag being published, not the branch
          # from which the workflow was dispatched.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false

      - name: Check out the pinned sibling player
        uses: actions/checkout@v7
        with:
          repository: BeamlakAschalew/flixquest-betterplayer
          ref: 9a4753b317c7153dbfc10738a6787fb3e5be8610
          path: flixquest-betterplayer
          persist-credentials: false

      - name: Test release configuration validation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Select release or preview mode
        id: build_mode
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          FLIXQUEST_ENV: ${{ secrets.FLIXQUEST_ENV }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FIREBASE_ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
        run: python3 .github/scripts/select_android_build.py

      - name: Prepare release configuration and signing
        if: ${{ steps.build_mode.outputs.mode == 'release' }}
        env:
          FLIXQUEST_ENV: ${{ secrets.FLIXQUEST_ENV }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 .github/scripts/prepare_android_release.py

      - name: Validate Firebase registration for the new package
        if: ${{ steps.build_mode.outputs.mode == 'release' }}
        env:
          FIREBASE_ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
        run: python3 .github/scripts/prepare_firebase_android.py release

      - name: Prepare preview configuration
        if: ${{ steps.build_mode.outputs.mode == 'preview' }}
        run: |
          cp .env.example .env
          python3 .github/scripts/prepare_firebase_android.py preview
          {
            echo '### Debug preview APK'
            echo 'This artifact uses example configuration and a temporary debug signing key.'
            echo 'Firebase options are deliberately invalid: Firebase services will not work.'
            echo 'Online features may not work. It cannot update a differently signed installation.'
            echo 'It is not suitable for a production release.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify signing keystore and alias
        if: ${{ steps.build_mode.outputs.mode == 'release' }}
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -keystore "$RUNNER_TEMP/flixquest-release-keystore.jks" \
            -storepass:env ANDROID_STORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > /dev/null

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: FastFlix/.fvmrc
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run feature tests
        run: |
          set +e
          flutter test --no-pub \
            test/anime_genre_test.dart \
            test/trending_anime_test.dart \
            test/home_screen_test.dart \
            test/fastflix_preferences_test.dart \
            test/hindi_source_priority_test.dart \
            test/manifest_size_estimator_test.dart \
            test/offline_download_test.dart \
            test/download_location_test.dart \
            test/download_settings_test.dart \
            test/player_audio_choices_test.dart \
            test/translation_catalog_test.dart \
            test/tv_settings_screen_test.dart \
            test/tv_remote_navigation_test.dart \
            test/tv_localization_test.dart \
            test/tv_back_dispatcher_test.dart \
            test/tv_update_test.dart \
            test/plus_screens_test.dart 2>&1 | tee "$RUNNER_TEMP/flutter-test.log"
          test_status=${PIPESTATUS[0]}
          set -e
          if (( test_status != 0 )); then
            python3 .github/scripts/report_android_failure.py "$RUNNER_TEMP/flutter-test.log"
            exit "$test_status"
          fi

      - name: Build universal APK
        if: ${{ steps.build_mode.outputs.mode == 'release' }}
        run: |
          flutter build apk --release --flavor prod --no-pub
          mkdir -p release-apks
          cp build/app/outputs/flutter-apk/app-prod-release.apk release-apks/FastFlix-universal.apk

      - name: Build debug preview APK
        if: ${{ steps.build_mode.outputs.mode == 'preview' }}
        run: |
          set +e
          flutter build apk --debug --flavor prod --no-pub 2>&1 | tee "$RUNNER_TEMP/preview-build.log"
          build_status=${PIPESTATUS[0]}
          set -e
          if (( build_status != 0 )); then
            python3 .github/scripts/report_android_failure.py "$RUNNER_TEMP/preview-build.log"
            exit "$build_status"
          fi
          mkdir -p release-apks
          cp build/app/outputs/flutter-apk/app-prod-debug.apk release-apks/FastFlix-preview-debug.apk
          cat > release-apks/README-preview.txt <<'EOF'
          This is a debug preview, not a production release.
          It uses the example configuration, including an emulator-only Laravel URL
          and an empty TMDB key. Online features may not work without real settings.
          Its deliberately invalid Firebase options do not register the app; Firebase
          services cannot work until the new package is registered in Firebase.
          It is signed with a temporary debug key and cannot update an installation
          signed by a different key. Do not distribute it as a production release.
          EOF

      - name: Run Android download unit tests
        env:
          BUILD_MODE: ${{ steps.build_mode.outputs.mode }}
        run: |
          set +e
          ./android/gradlew -p android :app:testProdDebugUnitTest \
            --tests 'dev.beamlak.flixquest_v2.downloads.DownloadSettingsTest' \
            --tests 'dev.beamlak.flixquest_v2.downloads.PublicDownloadDestinationTest' 2>&1 | tee "$RUNNER_TEMP/android-test.log"
          test_status=${PIPESTATUS[0]}
          set -e
          if (( test_status != 0 )); then
            if [[ "$BUILD_MODE" == 'preview' ]]; then
              python3 .github/scripts/report_android_failure.py "$RUNNER_TEMP/android-test.log"
            fi
            exit "$test_status"
          fi

      - name: Build per-ABI APKs
        if: ${{ steps.build_mode.outputs.mode == 'release' }}
        run: |
          flutter build apk --release --flavor prod --split-per-abi --no-pub
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-prod-release.apk" "release-apks/FastFlix-${abi}.apk"
          done

      - name: Verify signatures and generate checksums
        run: |
          for apk in release-apks/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          done
          (cd release-apks && sha256sum ./*.apk > SHA256SUMS.txt)

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build_mode.outputs.mode == 'release' && 'FastFlix-android-apks' || 'FastFlix-preview-debug-apk' }}
          path: FastFlix/release-apks/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Attach APKs to GitHub release
        if: ${{ steps.build_mode.outputs.mode == 'release' && ((github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # This also preserves the draft/prerelease state and existing notes.
            gh release upload "$RELEASE_TAG" release-apks/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            release_flags=(--verify-tag --generate-notes)
            # A semantic-version prerelease must not become the latest stable release.
            if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" release-apks/* --repo "$GITHUB_REPOSITORY" \
              "${release_flags[@]}"
          fi

      - name: Remove temporary configuration and signing material
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: rm -f FastFlix/.env FastFlix/android/key.properties "$RUNNER_TEMP/flixquest-release-keystore.jks" FastFlix/android/app/src/prod/debug/google-services.json FastFlix/android/app/src/prod/release/google-services.json
