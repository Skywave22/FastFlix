name: Inspect Flutter validation output
on:
  push:
    branches: ['arena/f6eedbd9-fastflix']
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize the timed-out test log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/123483096071/logs" > "$RUNNER_TEMP/job.log" 2> "$RUNNER_TEMP/diagnostic-error.log"; then
            echo "::error::Log download failed: $(head -c 200 "$RUNNER_TEMP/diagnostic-error.log")"
            exit 1
          fi
          python3 - "$RUNNER_TEMP/job.log" <<'PY'
          import re,sys
          lines=open(sys.argv[1], errors='replace').read().splitlines()
          tests=[line for line in lines if re.search(r'test/(?:app_logo|tv_settings_screen)_test\.dart:',line)]
          # The test descriptions are public source text. Remove URLs and
          # token-like values before publishing short diagnostics as notices.
          for line in tests[-8:]:
              line=re.sub(r'https?://\S+|[A-Za-z0-9_-]{32,}', '[redacted]', line)
              print('::notice::'+line[-600:].replace('%','%25'))
          print(f'::notice::Found {len(tests)} branding test progress lines.')
          PY
